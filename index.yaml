- tool: python
  category: encoding
  tags: [hex, bin, octal, int, math]
  description: |
    Esta sintaxis es para obtener distintas bases/formatos, basándose en un entero, flotante o expresión matemática que se desee codificar.
    <NUM>: número entero, flotante o expresión matemática.
    N: Ancho mínimo del resultado (rellena con ceros a la izquierda si hace falta)
    <TIPO>: letra que define el formato de salida
      b                             # binario
      o                             # octal
      d                             # decimal (default si no se pone nada)
      x                             # hexadecimal minúscula
      X                             # hexadecimal mayúscula
      n                             # como d pero usa el separador de miles
      c                             # valor de la tabla ascii en decimales
  command: |
    python3 -c 'print(f"{<NUM>:0{N}<TIPO>}")'

